  canonical_type: other
  common_units: [""]
sensory_score:
  aliases: ["sensory score", "overall acceptability", "overall acceptance", "overall acceptance (from 9)"]
  canonical_type: sensory
  common_units: [""]
sensory_odor:
  aliases: ["odor", "odour"]
  canonical_type: sensory
  common_units: [""]
sensory_color:
  aliases: ["color", "colour"]
  canonical_type: sensory
  common_units: [""]
sensory_taste:
  aliases: ["taste", "flavor", "flavour"]
  canonical_type: sensory
  common_units: [""]
sensory_texture:
  aliases: ["texture score", "sensory texture"]
  canonical_type: sensory
  common_units: [""]
storage_time_days:
  aliases: ["storage time (day)", "storage time", "storage day"]
  canonical_type: other
  common_units: ["days"]
weight_loss:
